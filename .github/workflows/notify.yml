name: KHLbot scheduled notifications
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Wake Render and process upcoming matches
        env:
          APP_URL: ${{ secrets.RENDER_APP_URL }}
          JOB_TOKEN: ${{ secrets.JOB_TOKEN }}
        run: |
          test -n "$APP_URL" || (echo "Missing RENDER_APP_URL secret" && exit 1)
          test -n "$JOB_TOKEN" || (echo "Missing JOB_TOKEN secret" && exit 1)
          curl --fail --show-error --silent --max-time 150 \
            -X POST "$APP_URL/jobs/notify" \
            -H "X-Job-Token: $JOB_TOKEN"
